name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Check architecture
        run: |
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          go version
          uname -m
      - name: Verify dependencies
        run: go mod tidy -diff
      - name: Differential and regression tests
        run: go test -p 2 -count=1 ./...
      - name: Static checks
        run: go vet -p 2 ./...
      - name: Scientific example
        run: go run ./examples/scientific
